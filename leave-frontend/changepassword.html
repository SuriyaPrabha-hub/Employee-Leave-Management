<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Change Password</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">

</head>

<body class="dashboard-body">

<div class="sidebar">

<h2>LeaveHub</h2>

<a id="dashboardLink" href="employee.html"><i class="fa-solid fa-house"></i> Dashboard</a>

<a href="applyleave.html"><i class="fa-solid fa-calendar-plus"></i> Apply Leave</a>

<a href="history.html"><i class="fa-solid fa-clock-rotate-left"></i> Leave History</a>

<a href="profile.html"><i class="fa-solid fa-user"></i> Profile</a>

<a href="changepassword.html"><i class="fa-solid fa-key"></i> Change Password</a>

<a href="javascript:void(0)" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>

</div>

<div class="main-content">

<div class="profile-card">

<h2>Change Password</h2>

<div class="input-box" style="margin-bottom: 15px;">
<input
type="password"
id="currentPassword"
placeholder="Current Password">
</div>

<div class="input-box" style="margin-bottom: 15px;">
<input
type="password"
id="newPassword"
placeholder="New Password (min 4 chars)">
</div>

<div class="input-box" style="margin-bottom: 20px;">
<input
type="password"
id="confirmPassword"
placeholder="Confirm New Password">
</div>

<button onclick="changePassword()">
Update Password
</button>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/config.js"></script>
<script>
    if (localStorage.getItem("role") === "ADMIN") {
        const dash = document.getElementById("dashboardLink");
        if (dash) dash.href = "admin.html";
    }
</script>
<script src="js/changepassword.js"></script>

</body>

</html>
